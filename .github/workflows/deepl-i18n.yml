name: DeepL Docusaurus translations

on:
  workflow_dispatch:
    inputs:
      locales:
        description: 'Comma-separated target locales (default: all configured targets)'
        required: false
        type: string
      force:
        description: 'Regenerate existing machine translations (never forces hand-maintained hu/de)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deepl-i18n
  cancel-in-progress: false

env:
  PROGRESS_BRANCH: i18n/deepl-progress

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resume translation progress
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git ls-remote --exit-code --heads origin "refs/heads/${PROGRESS_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${PROGRESS_BRANCH}:${PROGRESS_BRANCH}"
            git switch "${PROGRESS_BRANCH}"
            git merge --no-edit origin/main
          else
            git switch -c "${PROGRESS_BRANCH}"
          fi

      - name: Translate incrementally with DeepL
        id: translate
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          INPUT_LOCALES: ${{ inputs.locales }}
          INPUT_FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -uo pipefail
          args=(--write)
          if [[ -n "${INPUT_LOCALES:-}" ]]; then
            args+=("--locales=${INPUT_LOCALES}")
          fi
          if [[ "${INPUT_FORCE:-false}" == "true" ]]; then
            args+=(--force)
          fi

          set +e
          node scripts/translate-site-incremental-with-deepl.mjs "${args[@]}"
          rc=$?
          set -e

          if [[ "$rc" -eq 0 ]]; then
            status=complete
          elif [[ "$rc" -eq 75 ]]; then
            status=quota
          else
            status=error
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "DeepL status: $status (exit $rc)"

      - name: Detect translation changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          changed=false
          if [[ -n "$(git status --porcelain -- i18n)" ]]; then
            changed=true
          fi
          if [[ -d .deepl && -n "$(git status --porcelain -- .deepl)" ]]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit translation progress
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- i18n
          if [[ -d .deepl ]]; then
            git add -A -- .deepl
          fi
          git commit -m "i18n: update incremental DeepL translation progress"

      - name: Push translation progress
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${PROGRESS_BRANCH}"

      - name: Validate completed Docusaurus build
        id: build
        if: steps.translate.outputs.status == 'complete'
        continue-on-error: true
        run: npm run build

      - name: Create or update translation pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSLATE_STATUS: ${{ steps.translate.outputs.status }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet origin/main...HEAD; then
            echo "No translation diff remains against main."
            exit 0
          fi

          case "$TRANSLATE_STATUS" in
            complete)
              if [[ "$BUILD_OUTCOME" == "success" ]]; then
                status_line='✅ Complete — incremental translation finished and the Docusaurus build passed.'
                action_line='Review this PR and merge it when ready.'
              else
                status_line='❌ Translation finished, but the Docusaurus build failed.'
                action_line='Do not merge until the build failure is fixed.'
              fi
              ;;
            quota)
              status_line='⏸️ Partial — DeepL API quota was exhausted.'
              action_line='Do not merge yet. After quota is available again, rerun the workflow; it will continue on this same branch without retranslating completed segments.'
              ;;
            *)
              status_line='❌ Partial — translation stopped because of a non-quota error.'
              action_line='Do not merge yet. Partial translations and state were preserved for troubleshooting and continuation.'
              ;;
          esac

          body_file="$RUNNER_TEMP/deepl-pr-body.md"
          printf '%s\n\n%s\n\n' "$status_line" "$action_line" > "$body_file"
          cat >> "$body_file" <<'BODY'
          This PR is maintained by the DeepL Docusaurus workflow on the persistent `i18n/deepl-progress` branch.

          - Source locale: English
          - Unchanged Markdown/MDX segments are reused from `.deepl/i18n-state.json` without DeepL API calls.
          - Changed source segments and new strings are translated only when their SHA-256 source hash changes.
          - Docusaurus JSON messages are refreshed from the current source and unchanged translations are restored from state.
          - Existing hand-maintained Hungarian and German documents are not overwritten.
          - The DeepL API key is read only from the repository secret.
          BODY

          pr_number=$(gh pr list --state open --base main --head "$PROGRESS_BRANCH" --json number --jq '.[0].number // empty' || true)
          if [[ -n "$pr_number" ]]; then
            if gh pr edit "$pr_number" --body-file "$body_file"; then
              echo "number=$pr_number" >> "$GITHUB_OUTPUT"
              echo "Updated translation PR #$pr_number."
            else
              echo "::warning::Translation progress was pushed, but the existing PR body could not be updated."
            fi
          else
            error_file="$RUNNER_TEMP/deepl-pr-error.log"
            set +e
            url=$(gh pr create \
              --base main \
              --head "$PROGRESS_BRANCH" \
              --title "i18n: update Docusaurus translations with DeepL" \
              --body-file "$body_file" 2>"$error_file")
            rc=$?
            set -e

            if [[ "$rc" -eq 0 ]]; then
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "Created translation PR: $url"
            else
              echo "::warning::Translation progress was pushed, but GitHub Actions is not allowed to create a pull request in this repository."
              cat "$error_file"
              {
                echo "### DeepL translation progress"
                echo
                echo "Progress was safely pushed to \`$PROGRESS_BRANCH\`."
                echo "A pull request could not be created automatically by GitHub Actions."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Finalize workflow status
        env:
          TRANSLATE_STATUS: ${{ steps.translate.outputs.status }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TRANSLATE_STATUS" == "quota" ]]; then
            echo "::warning::DeepL quota exceeded. Progress was pushed and can be resumed later."
            exit 1
          fi
          if [[ "$TRANSLATE_STATUS" == "error" ]]; then
            echo "::error::DeepL translation stopped with a non-quota error. Progress was pushed for inspection."
            exit 1
          fi
          if [[ "$BUILD_OUTCOME" != "success" ]]; then
            echo "::error::Docusaurus build failed after translation."
            exit 1
          fi
