name: DeepL Docusaurus translations

on:
  workflow_dispatch:
    inputs:
      locales:
        description: 'Comma-separated target locales (default: all configured targets)'
        required: false
        type: string
      repair:
        description: 'Repair faulty machine translations by regenerating the selected locales'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deepl-i18n
  cancel-in-progress: false

env:
  PROGRESS_BRANCH: i18n/deepl-progress

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resume translation progress
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git ls-remote --exit-code --heads origin "refs/heads/${PROGRESS_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${PROGRESS_BRANCH}:${PROGRESS_BRANCH}"
            git switch "${PROGRESS_BRANCH}"
            git merge --no-edit origin/main
          else
            git switch -c "${PROGRESS_BRANCH}"
          fi

      - name: Translate incrementally with DeepL
        id: translate
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          INPUT_LOCALES: ${{ inputs.locales }}
          INPUT_REPAIR: ${{ inputs.repair }}
        shell: bash
        run: |
          set -uo pipefail
          args=(--write)
          if [[ -n "${INPUT_LOCALES:-}" ]]; then
            args+=("--locales=${INPUT_LOCALES}")
          fi
          if [[ "${INPUT_REPAIR:-false}" == "true" ]]; then
            args+=(--force)
          fi

          log_file="$RUNNER_TEMP/deepl-translation.log"
          set +e
          node scripts/translate-site-incremental-with-deepl.mjs "${args[@]}" 2>&1 | tee "$log_file"
          rc=${PIPESTATUS[0]}
          set -e

          if [[ "$rc" -eq 0 ]]; then
            status=complete
          elif [[ "$rc" -eq 75 ]]; then
            status=quota
          elif grep -q 'HTTP 403' "$log_file" && grep -q 'not allowed to access the API' "$log_file"; then
            status=api_access
          else
            status=error
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "DeepL status: $status (exit $rc)"

      - name: Detect translation changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          changed=false
          if [[ -n "$(git status --porcelain -- i18n)" ]]; then
            changed=true
          fi
          if [[ -d .deepl && -n "$(git status --porcelain -- .deepl)" ]]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit translation progress
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- i18n
          if [[ -d .deepl ]]; then
            git add -A -- .deepl
          fi
          git commit -m "i18n: update incremental DeepL translation progress"

      - name: Push translation progress
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${PROGRESS_BRANCH}"

      - name: Validate completed Docusaurus build
        id: build
        if: steps.translate.outputs.status == 'complete'
        continue-on-error: true
        run: npm run build

      - name: Create or update completed translation pull request
        id: pr
        if: steps.translate.outputs.status == 'complete' && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet origin/main...HEAD; then
            echo "Translations are already represented on main; no pull request is needed."
            exit 0
          fi

          body_file="$RUNNER_TEMP/deepl-pr-body.md"
          cat > "$body_file" <<'BODY'
          ✅ Complete — incremental DeepL translation finished and the Docusaurus build passed.

          Review this PR and merge it when ready.

          - Source locale: English
          - Unchanged Markdown/MDX segments are reused from `.deepl/i18n-state.json` without DeepL API calls.
          - Only new or source-changed segments are sent to DeepL.
          - Repair runs can regenerate selected machine-translated locales after faulty output.
          - Docusaurus JSON messages use the same incremental SHA-256 state tracking.
          - Existing hand-maintained Hungarian and German content is preserved.
          - The DeepL API key is read only from the repository secret.
          BODY

          pr_number=$(gh pr list --state open --base main --head "$PROGRESS_BRANCH" --json number --jq '.[0].number // empty' || true)
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --body-file "$body_file"
            echo "number=$pr_number" >> "$GITHUB_OUTPUT"
            echo "Updated completed translation PR #$pr_number."
          else
            url=$(gh pr create \
              --base main \
              --head "$PROGRESS_BRANCH" \
              --title "i18n: update Docusaurus translations with DeepL" \
              --body-file "$body_file")
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "Created completed translation PR: $url"
          fi

      - name: Report paused translation state
        if: steps.translate.outputs.status != 'complete'
        env:
          TRANSLATE_STATUS: ${{ steps.translate.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### DeepL translation paused"
            echo
            case "$TRANSLATE_STATUS" in
              quota)
                echo "DeepL quota is exhausted. Any completed progress was pushed to \`$PROGRESS_BRANCH\` and can be resumed later."
                ;;
              api_access)
                echo "DeepL returned HTTP 403: this account is currently not allowed to access the API."
                echo "Check the DeepL API subscription/account status and the repository secret \`DEEPL_API_KEY\`."
                ;;
              *)
                echo "Translation stopped because of a non-quota error. Any completed progress was pushed to \`$PROGRESS_BRANCH\` for inspection."
                ;;
            esac
            echo
            echo "No translation PR is created or updated until translation completes and the Docusaurus build passes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Finalize workflow status
        env:
          TRANSLATE_STATUS: ${{ steps.translate.outputs.status }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TRANSLATE_STATUS" == "quota" ]]; then
            echo "::warning::DeepL quota exceeded. Progress was preserved and can be resumed later."
            exit 1
          fi
          if [[ "$TRANSLATE_STATUS" == "api_access" ]]; then
            echo "::error::DeepL returned HTTP 403: this account is not allowed to access the API. Check the DeepL API plan/account status and DEEPL_API_KEY secret."
            exit 1
          fi
          if [[ "$TRANSLATE_STATUS" == "error" ]]; then
            echo "::error::DeepL translation stopped with a non-quota error. Progress was preserved for inspection."
            exit 1
          fi
          if [[ "$BUILD_OUTCOME" != "success" ]]; then
            echo "::error::Docusaurus build failed after translation."
            exit 1
          fi
