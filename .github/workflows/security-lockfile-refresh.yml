name: Security lockfile refresh

on:
  push:
    branches:
      - security/dependabot-fix
    paths:
      - package.json
      - .github/workflows/security-lockfile-refresh.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: security/dependabot-fix

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Show remediated dependency versions
        run: npm ls nanoid serialize-javascript uuid image-size || true

      - name: Commit refreshed package-lock.json
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for security overrides"
          git push origin HEAD:security/dependabot-fix
