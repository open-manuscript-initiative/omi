name: Website build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-build-${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a production publish midway through file replacement.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all locales
        run: npm run build

      - name: Verify daily server directory
        run: npm run test:server-directory

      - name: Verify safe production deployment and rollback
        run: |
          bash -n scripts/deploy-website-artifact.sh
          node --test tests/site-production-deploy.test.mjs
      - name: Stamp the exact published commit for origin/CDN verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/omi-releases
          printf '%s\n' "$GITHUB_SHA" > "build/omi-releases/${GITHUB_SHA}.txt"

      - name: Upload verified Docusaurus site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: omi-website-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 7

  ssh_preflight:
    name: Verify Plesk SSH access (no deployment)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check pinned host identity and read-only remote prerequisites
        shell: bash
        env:
          OMI_SITE_SSH_HOST: ${{ secrets.OMI_SITE_SSH_HOST }}
          OMI_SITE_SSH_USER: ${{ secrets.OMI_SITE_SSH_USER }}
          OMI_SITE_SSH_PRIVATE_KEY: ${{ secrets.OMI_SITE_SSH_PRIVATE_KEY }}
          OMI_SITE_SSH_KNOWN_HOSTS: ${{ secrets.OMI_SITE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for required in OMI_SITE_SSH_HOST OMI_SITE_SSH_USER OMI_SITE_SSH_PRIVATE_KEY OMI_SITE_SSH_KNOWN_HOSTS; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Required GitHub Actions secret $required is missing." >&2
              exit 1
            fi
          done
          [[ "$OMI_SITE_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || exit 1
          [[ "$OMI_SITE_SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]] || exit 1
          umask 077
          key="$RUNNER_TEMP/omi-site-preflight-key"
          hosts="$RUNNER_TEMP/omi-site-preflight-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$OMI_SITE_SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$OMI_SITE_SSH_KNOWN_HOSTS" > "$hosts"
          chmod 600 "$key" "$hosts"
          ssh-keygen -y -f "$key" >/dev/null
          # SHA256 fingerprint is public-key metadata, not private-key material.
          # Compare this with the fingerprint of the server's authorized key.
          echo "GitHub deployment key public fingerprint:"
          ssh-keygen -lf "$key"
          ssh-keygen -F "$OMI_SITE_SSH_HOST" -f "$hosts" >/dev/null || {
            echo "::error::SSH host key not pinned for the configured host." >&2
            exit 1
          }
          ssh -i "$key" -p 22 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o ConnectTimeout=20 \
            "$OMI_SITE_SSH_USER@$OMI_SITE_SSH_HOST" \
            bash -se -- "$OMI_SITE_SSH_USER" <<'REMOTE'
          set -euo pipefail
          expected_user="$1"
          [[ "$(id -un)" == "$expected_user" ]] || { echo "Unexpected SSH account"; exit 1; }
          [[ "$(id -u)" != 0 ]] || { echo "Refusing root deployment"; exit 1; }
          root=/var/www/vhosts/openmanuscript.org/httpdocs
          [[ -d "$root" && -w "$root" && ! -L "$root" ]] || {
            echo "Website document root is missing, read-only or a symlink"; exit 1;
          }
          [[ -w "$HOME" ]] || { echo "Home directory is not writable"; exit 1; }
          for command_name in rsync flock tar curl sha256sum; do
            command -v "$command_name" >/dev/null || { echo "Missing tool: $command_name"; exit 1; }
          done
          echo "SSH preflight passed; website files were not modified."
          REMOTE

  deploy:
    name: Publish OMI website to Plesk
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: omi-website-production
      cancel-in-progress: false
    steps:
      - name: Checkout deployment helper at the verified commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download exactly the site built by this workflow
        uses: actions/download-artifact@v4
        with:
          name: omi-website-${{ github.sha }}
          path: verified-site

      - name: Validate deployment package
        shell: bash
        run: |
          set -euo pipefail
          test -s verified-site/index.html
          test -s verified-site/hu/index.html
          test -s verified-site/de/index.html
          bash -n scripts/deploy-website-artifact.sh

      - name: Deploy site with SSH identity and pinned host key
        shell: bash
        env:
          OMI_SITE_SSH_HOST: ${{ secrets.OMI_SITE_SSH_HOST }}
          OMI_SITE_SSH_USER: ${{ secrets.OMI_SITE_SSH_USER }}
          OMI_SITE_SSH_PRIVATE_KEY: ${{ secrets.OMI_SITE_SSH_PRIVATE_KEY }}
          OMI_SITE_SSH_KNOWN_HOSTS: ${{ secrets.OMI_SITE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for required in OMI_SITE_SSH_HOST OMI_SITE_SSH_USER OMI_SITE_SSH_PRIVATE_KEY OMI_SITE_SSH_KNOWN_HOSTS; do
            if [[ -z "${!required}" ]]; then
              echo "Required GitHub Actions secret $required is not configured." >&2
              exit 1
            fi
          done
          [[ "$OMI_SITE_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || exit 1
          [[ "$OMI_SITE_SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]] || exit 1

          key="$RUNNER_TEMP/omi-site-deploy-key"
          hosts="$RUNNER_TEMP/omi-site-known-hosts"
          install -m 600 /dev/null "$key"
          install -m 600 /dev/null "$hosts"
          printf '%s\n' "$OMI_SITE_SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$OMI_SITE_SSH_KNOWN_HOSTS" > "$hosts"

          archive="$RUNNER_TEMP/omi-site-${GITHUB_RUN_ID}.tar.gz"
          tar -czf "$archive" -C verified-site .
          checksum="$(sha256sum "$archive" | cut -d' ' -f1)"
          remote="$OMI_SITE_SSH_USER@$OMI_SITE_SSH_HOST"
          ssh_opts=(-i "$key" -p 22 -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -o ConnectTimeout=20)
          scp_opts=(-i "$key" -P 22 -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -o ConnectTimeout=20)

          ssh "${ssh_opts[@]}" "$remote" \
            'umask 077; mkdir -p "$HOME/.omi-website-deploy/incoming"; chmod 700 "$HOME/.omi-website-deploy" "$HOME/.omi-website-deploy/incoming"'
          scp "${scp_opts[@]}" "$archive" \
            "$remote:.omi-website-deploy/incoming/${GITHUB_RUN_ID}-${GITHUB_SHA}.tar.gz"
          ssh "${ssh_opts[@]}" "$remote" \
            bash -s -- "$GITHUB_SHA" "$GITHUB_RUN_ID" "$checksum" \
            < scripts/deploy-website-artifact.sh

          echo "Published OMI website commit $GITHUB_SHA to https://openmanuscript.org/" >> "$GITHUB_STEP_SUMMARY"
